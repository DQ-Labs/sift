name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-release.mjs --check-tag

  build:
    name: Build and test
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: sift-*
          path: dist
          merge-multiple: true
      - run: npm run release:checksums
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
